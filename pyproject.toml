[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-appointment-api"
version = "0.1.0"
description = "Hospital Appointment Management API"
requires-python = ">=3.11"
authors = [ { name = "Project Maintainer" } ]
license = { text = "MIT" }
dependencies = [
  "fastapi==0.100.0",
  "uvicorn[standard]==0.23.0",
  "SQLAlchemy==2.0.22",
  "alembic==1.11.1",
  "pydantic[email]==1.10.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app"]
