name: Python Quality Gates

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'

      - name: Verify Python
        run: |
          python --version
          which python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build

      # GATE 1: Lint
      - name: Gate 1 - Ruff lint
        run: |
          ruff check .

      # GATE 2: Tests + 85% coverage
      - name: Gate 2 - Pytest coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # GATE 3: Security
      - name: Gate 3 - Bandit security scan
        run: |
          bandit -r app

      # Only reached if all three gates pass
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-appointment-api-wheel
          path: dist/*.whl

  docker-publish:
    needs: quality-gates
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Check Docker Hub secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "secrets_present=0" >> $GITHUB_OUTPUT
          else
            echo "secrets_present=1" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.check_secrets.outputs.secrets_present == '1' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ steps.check_secrets.outputs.secrets_present == '1' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-api:${{ github.sha }}

      - name: Skip docker publish when secrets missing
        if: ${{ steps.check_secrets.outputs.secrets_present != '1' }}
        run: echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN not set — skipping docker publish"